name: saphir_player
description: Lokaler Streaming-Videoplayer fuer Serien und Filme mit portablem NAS- und Sync-Konzept.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3: ^2.4.6
  window_manager: ^0.4.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/